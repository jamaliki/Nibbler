name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate synchronized versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          arguments=()
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments=(--tag "$RELEASE_TAG")
          fi
          version=$(python -m tools.validate_release --metadata-only "${arguments[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel ${{ matrix.platform.name }} / Python ${{ matrix.python-version }}
    needs: metadata
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            kind: linux
            container: quay.io/pypa/manylinux2014_x86_64:latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            kind: linux
            container: quay.io/pypa/manylinux2014_aarch64:latest
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            kind: native
            container: ""
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            kind: native
            container: ""
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            kind: native
            container: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build manylinux wheel
        if: matrix.platform.kind == 'linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88"
          target: ${{ matrix.platform.target }}
          manylinux: "2_17"
          container: ${{ matrix.platform.container }}
          args: >-
            --release --locked --strip --compatibility pypi --out dist
            -i python${{ matrix.python-version }}

      - name: Build native wheel
        if: matrix.platform.kind == 'native'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88"
          target: ${{ matrix.platform.target }}
          args: --release --locked --strip --compatibility pypi --out dist -i python

      - name: Install and qualify wheel
        run: python -m tools.qualify_release dist

      - name: Retain qualified wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    name: Source distribution
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.14.1
          rust-toolchain: "1.88"

      - name: Rebuild and qualify source distribution
        run: python -m tools.qualify_release dist

      - name: Retain qualified source distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble qualified release
    needs: [metadata, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download qualified packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Validate the complete artifact set
        run: |
          python -m pip install --disable-pip-version-check twine==7.0.0
          twine check --strict dist/*
          python -m tools.validate_release \
            --dist dist \
            --expected-wheel-count 25 \
            --python-tags cp310 cp311 cp312 cp313 cp314 \
            --platform-count 5 \
            --write-checksums release/SHA256SUMS

      - name: Retain complete release packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Retain release checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-metadata
          path: release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, assemble]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/nibbler-cif
    permissions:
      id-token: write
    steps:
      - name: Download complete release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: dist

      - name: Publish complete release with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          print-hash: true

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [metadata, assemble, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download complete release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: dist

      - name: Download release checksums
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-metadata
          path: release

      - name: Create release only after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_options=(--verify-tag --generate-notes --title "Nibbler $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *rc* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* release/SHA256SUMS "${release_options[@]}"
