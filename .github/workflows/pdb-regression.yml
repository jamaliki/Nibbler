name: PDB regression

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: pdb-regression
  cancel-in-progress: true

jobs:
  stress:
    name: Complete pinned corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88"

      - name: Restore pinned PDB corpus
        id: corpus-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/pdb-stress
          key: pdb-stress-${{ hashFiles('benchmarks/pdb_corpus.toml') }}

      - name: Install benchmark runtime
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --disable-pip-version-check \
            maturin==1.14.1 pyarrow==25.0.0

      - name: Build release extension
        run: maturin develop --release --locked

      - name: Fetch and verify corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: python -m tools.fetch_pdb_corpus

      - name: Measure all formats and full documents
        run: |
          mkdir -p benchmarks/results
          python -m benchmarks.pdb_stress \
            --formats all \
            --warmups 2 \
            --samples 7 \
            --full-document \
            --json > benchmarks/results/pdb-regression.json

      - name: Check correctness and broad performance floors
        run: |
          python -m benchmarks.check_pdb_report \
            benchmarks/results/pdb-regression.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain complete benchmark report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pdb-regression-${{ github.run_id }}
          path: benchmarks/results/pdb-regression.json
          if-no-files-found: warn
          retention-days: 90
