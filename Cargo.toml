[package]
name = "nibbler-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native core for the Nibbler CIF toolkit"
license = "MIT"
repository = "https://github.com/jamaliki/Nibbler"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.0", default-features = false, features = ["macros"], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
