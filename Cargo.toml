[package]
name = "nibbler-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native core for the Nibbler CIF toolkit"
license = "MIT AND BSD-3-Clause-LBNL AND Apache-2.0"
repository = "https://github.com/jamaliki/Nibbler"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
robustness = []
python = ["dep:pyo3", "dep:serde_json"]
reduce3 = ["dep:reduce3", "dep:serde_json"]
extension-module = ["python", "pyo3/extension-module", "dep:mimalloc"]

[dependencies]
arrow-array = { version = "59.2.0", default-features = false, features = ["ffi"] }
arrow-schema = { version = "59.2.0", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
memchr = { version = "2.7.6", default-features = false }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
pyo3 = { version = "0.29.0", default-features = false, features = ["macros"], optional = true }
reduce3 = { git = "https://github.com/jamaliki/reduce3", rev = "48b7a45d17eedc128cf46ee3b47199a2cd468c4a", default-features = false, optional = true }
regex = { version = "1.12.2", default-features = false, features = ["std"] }
rmp-serde = { version = "1.3.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["std"] }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }

[[test]]
name = "robustness"
path = "tests/robustness.rs"
required-features = ["robustness"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
